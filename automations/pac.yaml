# At startup initialize temperature command from HVAC
- id: extend_pac_temperature_set_default_value
  alias: extend_pac_temperature_set_default_value
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/pac/+/+
  actions:
    - variables:
        floor: "{{ trigger.topic.split('/')[2] }}"
        room: "{{ trigger.topic.split('/')[3] }}"
        set_heat_from_device: "{{ (trigger.payload | from_json).get('occupied_heating_setpoint', None) | float }}"
        set_cool_from_device: "{{ (trigger.payload | from_json).get('occupied_cooling_setpoint', None) | float }}"
        set_heat: "{{ states('sensor.temperature_set_pac_' ~ room ~ '_heat') | float(0) | round(1) }}"
        set_cool: "{{ states('sensor.temperature_set_pac_' ~ room ~ '_cool') | float(0) | round(1) }}"
    - if:
        - condition: template
          value_template: "{{ set_heat <= 0 }}"
      then:
        - action: mqtt.publish
          data:
            topic: homeassistant/climate/{{ floor }}/{{ room}}/temperature/heat/set
            payload: "{{ set_heat_from_device }}"
        - action: mqtt.publish
          data:
            topic: homeassistant/climate/{{ floor }}/{{ room}}/temperature/heat/set/hvac_interface
            payload: "{{ set_heat_from_device }}"
    - if:
        - condition: template
          value_template: "{{ set_cool <= 0 }}"
      then:
        - action: mqtt.publish
          data:
            topic: homeassistant/climate/{{ floor }}/{{ room}}/temperature/cool/set
            payload: "{{ set_cool_from_device }}"
        - action: mqtt.publish
          data:
            topic: homeassistant/climate/{{ floor }}/{{ room}}/temperature/cool/set/hvac_interface
            payload: "{{ set_cool_from_device }}"

# On set temperature command send it to HVAC interface
- id: extend_pac_temperature_set_hvac_interface
  alias: extend_pac_temperature_set_hvac_interface
  triggers:
    - trigger: mqtt
      topic: homeassistant/climate/+/+/temperature/+/set
  actions:
    - variables:
        floor: "{{ trigger.topic.split('/')[2] }}"
        room: "{{ trigger.topic.split('/')[3] }}"
        type: "{{ trigger.topic.split('/')[5] }}"
        value: "{{ trigger.payload | float(0) }}"
        previous_value: "{{ states('sensor.temperature_set_pac_' ~ room ~ '_' ~ type) | float }}"
    - if:
        - condition: template
          value_template: "{{ value != previous_value }}"
      then:
        - action: mqtt.publish
          data:
            topic: homeassistant/climate/{{ floor }}/{{ room }}/temperature/{{ type }}/set/hvac_interface
            payload: "{{ value }}"

# on set temperature command heat calculate correction and send it to HVAC
- id: extend_pac_temperature_set_correction_on_set_temp_heat
  alias: extend_pac_temperature_set_correction_on_set_temp_heat
  triggers:
    - trigger: mqtt
      topic: homeassistant/climate/+/+/temperature/heat/set
  actions:
    - variables:
        floor: "{{ trigger.topic.split('/')[2] }}"
        room: "{{ trigger.topic.split('/')[3] }}"
        set_value: "{{ trigger.payload | float(0) }}"
        ext_temp: "{{ states('sensor.temperature_' ~ room) | float(0) }}"
        hvac_temp: "{{ state_attr('climate.pac_' ~ room ~ '_pac_' ~ room,'current_temperature') | float(0) }}"
        hvac_mode: "{{ state_attr('climate.pac_' ~ room ~ '_pac_' ~ room,'system_mode') }}"
        diff: "{{ hvac_temp - ext_temp }}"
        set_device: "{{ ((set_value + diff) * 2) | round(0) / 2 }}" # rounded to the closest 0.5
    - if:
        - condition: template
          value_template: "{{
            hvac_mode != 'off' and
            hvac_mode != 'cool' and
            diff >= -5 and diff <= 5 and
            ext_temp > 0 and
            hvac_temp > 0
            }}"
      then:
        - if:
            - condition: template
              value_template: "{{ set_device >= 16 and set_device <= 30  }}"
          then:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/pac/{{ floor }}/{{ room }}/set/occupied_heating_setpoint
                payload: "{{ set_device }}"
            - action: mqtt.publish
              data:
                topic: homeassistant/climate/{{ floor }}/{{ room }}/temperature/diff/set
                payload: "{{ diff }}"

