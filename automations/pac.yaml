# Extend fan mode commands to fit into HA interface (swing + louver folded into one swing list)
# Temperature correction is handled by Versatile Thermostat (climate.vtherm_*) — see PAC-CLIMATE.md
- id: extend_pac_fan_mode
  alias: extend_pac_fan_mode
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/pac/+/+
  actions:
    - action: mqtt.publish
      data:
        topic:
          homeassistant/climate/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
          }}/extended_fan
        payload:
          "{% if trigger.payload_json.swing_mode == 'on' %} \n  swing\n{% else
          %} \n  {{trigger.payload_json.ac_louver_position}}\n{% endif %}"
- id: extend_pac_fan_mode_set
  alias: extend_pac_fan_mode_set
  triggers:
    - trigger: mqtt
      topic: homeassistant/climate/+/+/extended_fan/set
  actions:
    - if:
        - condition: template
          value_template: "{{trigger.payload == 'swing' }}"
      then:
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/swing_mode
            payload: "on"
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/ac_louver_position
            payload:
      else:
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/swing_mode
            payload: "off"
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/ac_louver_position
            payload: "{{trigger.payload}}"
