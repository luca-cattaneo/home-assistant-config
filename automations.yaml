# on temperature measured change calculate command correction and send it to HVAC
- id: extend_pac_temperature_set_correction_on_temp_change
  alias: extend_pac_temperature_set_correction_on_temp_change
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/sensor/+/+
    - trigger: mqtt
      topic: zigbee2mqtt/pac/+/+
  actions:
    - variables:
        floor: "{{ trigger.topic.split('/')[2] }}"
        room: "{{ trigger.topic.split('/')[3] }}"
        ext_temp: "{{ states('sensor.temperature_' ~ room) | float(0) }}"
        hvac_temp: "{{ state_attr('climate.pac_' ~ room ~ '_pac_' ~ room,'current_temperature') | float(0) }}"
        hvac_mode: "{{ state_attr('climate.pac_' ~ room ~ '_pac_' ~ room,'system_mode') }}"
        diff: "{{ hvac_temp - ext_temp }}"
        set_heat: "{{ states('sensor.temperature_set_pac_' ~ room ~ '_heat') | float(0)}}"
        set_cool: "{{ states('sensor.temperature_set_pac_' ~ room ~ '_cool') | float(0)}}"
        set_heat_device_previous: "{{ states('sensor.temperature_real_pac_' ~ room ~ '_heat') | float(0)}}"
        set_cool_device_previous: "{{ states('sensor.temperature_real_pac_' ~ room ~ '_cool') | float(0)}}"
        set_heat_device: "{{ ((set_heat + diff) * 2) | round(0) / 2 }}" # rounded to the closest 0.5
        set_cool_device: "{{ ((set_cool + diff) * 2) | round(0) / 2 }}" # rounded to the closest 0.5
    - if:
        - condition: template
          value_template: "{{
            hvac_mode != 'off' and
            diff >= -5 and diff <= 5 and
            ext_temp > 0 and
            hvac_temp > 0
            }}"
      then:
        - if:
            - condition: template
              value_template: "{{
                hvac_mode != 'cool' and
                set_heat_device >= 16 and
                set_heat_device <= 30 and
                (set_heat_device_previous | float(0) - set_heat_device | float(0)) | abs > 0.5
                }}"
          then:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/pac/{{ floor }}/{{ room }}/set/occupied_heating_setpoint
                payload: "{{ set_heat_device }}"
        - if:
            - condition: template
              value_template: "{{
                hvac_mode != 'heat' and
                set_cool_device >= 16 and
                set_cool_device <= 30 and
                (set_cool_device_previous | float(0) - set_cool_device | float(0)) | abs > 0.5
                }}"
          then:
            - action: mqtt.publish
              data:
                topic: zigbee2mqtt/pac/{{ floor }}/{{ room }}/set/occupied_cooling_setpoint
                payload: "{{ set_cool_device }}"
        - action: mqtt.publish
          data:
            topic: homeassistant/climate/{{ floor }}/{{ room }}/temperature/diff/set
            payload: "{{ diff }}"
  trace:
    stored_traces: 100000

# Extend fan mode commands to fit into HA interface
- id: extend_pac_fan_mode
  alias: extend_pac_fan_mode
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/pac/+/+
  actions:
    - action: mqtt.publish
      data:
        topic:
          homeassistant/climate/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
          }}/extended_fan
        payload:
          "{% if trigger.payload_json.swing_mode == 'on' %} \n  swing\n{% else
          %} \n  {{trigger.payload_json.ac_louver_position}}\n{% endif %}"
- id: extend_pac_fan_mode_set
  alias: extend_pac_fan_mode_set
  triggers:
    - trigger: mqtt
      topic: homeassistant/climate/+/+/extended_fan/set
  actions:
    - if:
        - condition: template
          value_template: "{{trigger.payload == 'swing' }}"
      then:
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/swing_mode
            payload: "on"
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/ac_louver_position
            payload:
      else:
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/swing_mode
            payload: "off"
        - action: mqtt.publish
          data:
            topic:
              zigbee2mqtt/pac/{{ trigger.topic.split('/')[2]~'/'~trigger.topic.split('/')[3]
              }}/set/ac_louver_position
            payload: "{{trigger.payload}}"
