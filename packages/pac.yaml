      name: pac_petite_chambre
      device:
        identifiers: [zigbee2mqtt_0x5cc7c1fffeb330df]
        name: pac/haut/petite_chambre
      current_temperature_topic: zigbee2mqtt/pac/haut/petite_chambre
      fan_mode_command_topic: zigbee2mqtt/pac/haut/petite_chambre/set/fan_mode
      fan_mode_state_topic: zigbee2mqtt/pac/haut/petite_chambre
      preset_mode_command_topic: zigbee2mqtt/pac/haut/petite_chambre/set/preset
      preset_mode_state_topic: zigbee2mqtt/pac/haut/petite_chambre
