      temperature_low_command_topic: homeassistant/climate/haut/petite_chambre/temperature/heat/set
      temperature_high_state_topic: "homeassistant/climate/haut/petite_chambre/temperature/cool/set/hvac_interface"
      temperature_low_state_topic: "homeassistant/climate/haut/petite_chambre/temperature/heat/set/hvac_interface"
      mode_command_topic: zigbee2mqtt/pac/haut/petite_chambre/set/system_mode
      mode_state_topic: zigbee2mqtt/pac/haut/petite_chambre

  # PAC combles -------------------------------------------
